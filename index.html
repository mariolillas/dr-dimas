<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Dimas</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dr. Dimas">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F2F2F7; --card:#fff; --ink:#111; --ink2:#6E6E73; --ink3:#AEAEB2; --line:#E5E5EA;
  --mint:#A8F0D8; --mint2:#3E8F78; --mintbg:#E8FBF4; --red:#FF3B30; --redbg:#FFEDEC; --amber:#B25E00; --amberbg:#FFF4E0;
  --r:14px; --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--sans);-webkit-text-size-adjust:100%}
body.dark{background:#0B0B0C;color:#F5F5F7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.4;cursor:default}
.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0}
.large{font-size:34px;line-height:1.1}
.muted{color:var(--ink2)} .small{font-size:13px} .muted-l{color:#C7C7CC;max-width:520px;text-align:center}
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 2px}
.foot{font-size:13px;color:var(--ink2);margin:8px 4px 0}
.pre{white-space:pre-wrap}
.row{display:flex;align-items:center} .col{display:flex;flex-direction:column} .gap{gap:12px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .center{justify-content:center;text-align:center}
.ic{width:22px;height:22px;flex:none}
#app{min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* ---- botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px}
.btn .ic{width:19px;height:19px}
.btn.primary{background:var(--ink);color:#fff}
.btn.mint{background:var(--mint);color:var(--ink)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.ghost-l{background:#1C1C1E;color:#fff;border:1px solid #2C2C2E}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red);background:transparent;margin:24px auto 0;display:flex}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%} .btn.big{min-height:54px;font-size:18px}
.link{color:var(--mint2);font-weight:600;display:inline-flex;align-items:center;gap:4px;font-size:16px}
.link.strong{font-weight:700;color:var(--ink)} .link.danger{color:var(--red)}
.link-l{color:var(--mint);margin-top:18px;font-size:15px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}

/* ---- auth (oscuro) ---- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 24px;text-align:center}
.auth h1{font-size:34px}
.logo-big{width:min(320px,70vw);height:auto;border-radius:18px}
.auth-list{list-style:none;padding:0;margin:0;display:grid;gap:10px;text-align:left;color:#E5E5EA;max-width:480px}
.auth-list li{display:flex;gap:10px;align-items:flex-start}.auth-list .ic{color:var(--mint)}
.recovery-code{font:600 26px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.08em;background:#1C1C1E;border:1px dashed var(--mint);border-radius:14px;padding:18px 22px;color:#fff;word-break:break-all;max-width:560px}
.dark-code{background:var(--ink);color:#fff}
.check-l{display:flex;gap:10px;align-items:center;color:#E5E5EA}
.input-l{width:min(520px,90vw);padding:14px 16px;border-radius:12px;border:1px solid #3A3A3C;background:#1C1C1E;color:#fff;font-size:20px;text-align:center}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em}

/* ---- teclado PIN ---- */
.pin{display:flex;flex-direction:column;align-items:center;gap:10px}
.pin-title{font-size:20px;font-weight:600}.pin-sub{margin:0;color:#8E8E93;font-size:14px}
.pin-dots{display:flex;gap:16px;margin:8px 0}.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;opacity:.8}.pin-dots i.on{background:currentColor}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-err{color:#FF6961;min-height:20px;margin:0;font-size:14px}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:16px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);font-size:30px;display:grid;place-items:center}
.key:active{background:rgba(255,255,255,.3)}
.pin.light .key{background:var(--bg);color:var(--ink)} .pin.light .key:active{background:var(--line)} .pin.light{color:var(--ink)}

/* ---- top / nav ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 24px 10px;position:sticky;top:0;z-index:5;background:rgba(242,242,247,.82);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid rgba(0,0,0,.05)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;border-radius:50%;background:#000}
.brand b{display:block;font-size:19px;line-height:1}.brand small{color:var(--ink2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.pill .ic{width:13px;height:13px;color:var(--mint2)}
.pill.test{background:var(--amberbg);border-color:#F5D9A8;color:#6B3A00;font-weight:600}.pill.test .ic{color:var(--amber)}
.test-card{border:1.5px solid #F5D9A8;background:var(--amberbg)}
.seg-mini{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;background:rgba(242,242,247,.86);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
.nav-title{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.nav-r{justify-self:end;display:flex;gap:14px}.nav-back{display:flex;align-items:center;gap:2px;color:var(--mint2);font-weight:500}
.nav.patient-mode{background:#fff}

/* ---- página ---- */
.page{max-width:1100px;margin:0 auto;padding:18px 24px 40px;display:flex;flex-direction:column;gap:18px}
.page.narrow{max-width:760px}
.day-nav{display:flex;align-items:center;gap:14px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
section>h3,.sec-h{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:0 4px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{font:inherit;margin:0}
.count{background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;letter-spacing:0}
.card{background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card>h3{font-size:17px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0;display:flex;gap:8px;align-items:center}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h h3{font-size:20px}
.two-col,.ses-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.two-col,.ses-grid{grid-template-columns:1fr}}

/* ---- listas ---- */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.list.flat{background:transparent;border-radius:0}
.row-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px;text-align:left;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.row-item b{display:block;font-weight:600}.row-item small{display:block;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .chev{color:var(--ink3);width:16px}.row-item>.ic:first-child{color:var(--mint2)}
.row-item .ic.ok{color:var(--mint2)}
.time{width:74px;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.chips.wrap{justify-content:flex-start}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.chip.red{background:var(--redbg);color:#C4281C}.chip.amber{background:var(--amberbg);color:var(--amber)}.chip.mint{background:var(--mint);color:var(--ink)}.chip.gray{background:var(--bg);color:var(--ink2)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--mintbg);color:var(--mint2);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.avatar.xl{width:84px;height:84px;font-size:30px;background:var(--mint);color:var(--ink)}
.avatar.photo{overflow:hidden;background:var(--bg)}.avatar.photo img{width:100%;height:100%;object-fit:cover}
.avatar-btn{position:relative;flex:none}.avatar-btn .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.avatar-btn .cam .ic{width:16px;height:16px}
.ph-group{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ph-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ph-h small{color:var(--ink2);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.empty.big{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border-radius:var(--r)}
.empty.big .ic{width:40px;height:40px;color:var(--mint2)}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;font-size:15px;margin:0}
.banner span{flex:1}.banner.amber{background:var(--amberbg);border-color:#F5D9A8;color:#6B3A00}.banner.red{background:var(--redbg);border-color:#F7C4C0;color:#8E1B12}
.banner.mint{background:var(--mintbg);border-color:var(--mint)}.banner.gray{color:var(--ink2)}

/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:120px}
.tile .ic{width:26px;height:26px;margin-bottom:auto;color:var(--mint2)}.tile small{color:var(--ink2);font-size:13px}
.tile.dark{background:var(--ink);color:#fff}.tile.dark .ic{color:var(--mint)}.tile.dark small{color:#AEAEB2}

/* ---- segmentado ---- */
.seg{display:inline-flex;background:#E3E3E8;border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);min-height:34px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.small button{padding:5px 12px;min-height:30px}
.yn-seg button.on.red{background:var(--red);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#E3E3E8;border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;font-size:17px}
.search .ic{color:var(--ink2);width:18px}

/* ---- formularios ---- */
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.group-h{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:10px 4px -8px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:50px;border-bottom:1px solid var(--line)}
.group .field:last-child{border-bottom:0}
.field>span:first-child{color:var(--ink);flex:none;max-width:55%}
.field input,.field select,.field textarea{border:0;background:transparent;text-align:right;outline:none;min-width:0;flex:1;font-size:17px;color:var(--ink2)}
.field input:focus,.field textarea:focus{color:var(--ink)}
.field.stack{flex-direction:column;align-items:stretch}.field.stack textarea{text-align:left;background:var(--bg);border-radius:10px;padding:10px;color:var(--ink)}
.field.yn{flex-wrap:wrap}.field.yn input{flex-basis:100%;text-align:left;background:var(--bg);border-radius:10px;padding:8px 10px}
.card .field{padding:8px 0}
.inline3,.inline2{display:grid;grid-template-columns:repeat(3,1fr)}.inline2{grid-template-columns:1fr 1.4fr}
.inline3 .field,.inline2 .field{border-bottom:0;border-right:1px solid var(--line)}.inline3 .field:last-child,.inline2 .field:last-child{border-right:0}
@media (max-width:760px){.inline3,.inline2{grid-template-columns:1fr}.inline3 .field,.inline2 .field{border-right:0;border-bottom:1px solid var(--line)}}
.w60{width:60px;flex:none!important;text-align:center!important;background:var(--bg)!important;border-radius:8px;padding:4px}
.w90{max-width:90px}
.check{display:flex;gap:10px;align-items:center;padding:6px 4px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:#E9E9EA;position:relative;transition:.2s;flex:none!important;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked{background:#34C759}.switch input:checked::after{left:22px}
.switch span:empty{display:none}
.promo-row{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.promo-row input{border:0;background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;flex:1}
.group .link{padding:12px 16px}

/* ---- expediente ---- */
.hero{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}
.hero .name{font-size:32px}.hero-actions{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:15px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;text-align:right}.kv dd.red{color:#C4281C;font-weight:600}
.kv.compact{background:var(--card);border-radius:12px;padding:12px 16px}
.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.tl-item:last-child{border-bottom:0}.tl-item small{display:block;color:var(--ink2);font-size:13px}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--ink);flex:none}.tl-dot.filler{background:#E58FB0}.tl-dot.sculptra{background:#9C8CF0}.tl-dot.tox{background:var(--mint2)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.thumbs.small{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid transparent}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:4px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;text-align:left}
.thumb.add{border:2px dashed var(--line);color:var(--mint2)}.thumb.add span{position:static;background:none;color:var(--mint2);text-align:center}
.thumb.on{border-color:var(--ink)}.thumb.mini{width:56px;flex:none}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1}
.photo-full{max-width:100%;max-height:78vh;border-radius:12px}

/* ---- sesión / mapa ---- */
.ses-head{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}.ses-head h2{font-size:26px}
.map-card{align-items:center}
.map-wrap{width:100%;max-width:520px}
.facemap{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.facemap.small{max-width:240px}
.face-art path,.face-art circle{fill:none;stroke:#3A3A3C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.face-art .skin{fill:#FBF6F2}.face-art .soft{stroke:#C7C7CC;stroke-dasharray:3 6}.face-art .lip{stroke:#B86F7E}.face-art .iris{fill:#3A3A3C;stroke:none}
.zone-hint{fill:var(--mint);opacity:.13}
.pt circle{fill:var(--mint);stroke:var(--ink);stroke-width:1.5}
.pt text{font:700 11px var(--sans);text-anchor:middle;fill:var(--ink)}
.pt.sel circle{fill:var(--ink)}.pt.sel text{fill:#fff}
.hint{font-size:13px;color:var(--ink2);margin:0;text-align:center}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.chip-btn{padding:6px 12px;border-radius:99px;background:var(--bg);font-weight:600;font-size:14px;min-height:34px}
.chip-btn.on{background:var(--mint)}
.pt-panel{width:100%;background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pt-panel select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.stepper{display:flex;align-items:center;gap:16px}.stepper button{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:26px}
.stepper b{font-size:22px;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.product{border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;flex-direction:column;gap:8px}
.product:last-of-type{border-bottom:0}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.sum th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.sum td{padding:8px 4px;border-bottom:1px solid var(--line)}.sum td:not(:first-child),.sum th:not(:first-child){text-align:right}
.sum tfoot td{border-bottom:0;font-weight:600}.sum .num{text-align:right}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:760px){.pay-grid,.product-grid{grid-template-columns:1fr}}
.pay-total{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.big-total{font:700 34px var(--sans);font-variant-numeric:tabular-nums}
.maps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.maps figure{margin:0;flex:1;min-width:200px;text-align:center}.maps figcaption{font-size:13px;color:var(--ink2)}

/* ---- consentimiento / firmas ---- */
.consent h1{font-size:30px}
.legal{font-size:16px;line-height:1.55;margin:0;color:#2C2C2E}
.legal-sec h3{font-size:13px;letter-spacing:.06em;color:var(--ink2)}
.legal-sec.missing{outline:2px solid var(--red)}
.initial-row{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.pad-wrap{position:relative;width:100%;border:1.5px dashed #C7C7CC;border-radius:12px;background:#FCFCFD}
.pad-wrap.signed{border-color:var(--mint2);border-style:solid}
.pad-wrap .link{position:absolute;top:6px;right:10px;font-size:13px}
.pad{width:100%;height:170px;display:block;touch-action:none}
.pad-wrap.small{width:220px}.pad.initials{height:90px}
.sig-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1.5px solid var(--line);text-align:left;font-weight:500}
.radio i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.radio.on{border-color:var(--mint2);background:var(--mintbg)}.radio.on i{border:7px solid var(--mint2)}
.radio small{display:block;color:var(--ink2);font-size:13px}
.sig-mini{height:34px;vertical-align:middle;background:#fff;border-radius:6px}
.sig-block{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sig-block img{height:90px;object-fit:contain;object-position:left}.sig-block span{font-size:13px;color:var(--ink2)}
.doc-sec h3{font-size:14px;letter-spacing:.05em;margin-bottom:4px}
.bullets{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}.bullets.warn li::marker{color:var(--amber)}
.instr p{font-size:16px;line-height:1.55}

/* ---- split (por completar) ---- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto;align-items:start}
.split-l{position:sticky;top:70px;display:flex;flex-direction:column;gap:10px}
.paper-view{background:#000;border-radius:12px;overflow:auto;max-height:72vh;touch-action:pan-x pan-y pinch-zoom}
.paper-view img{width:100%;display:block}
.split-r{display:flex;flex-direction:column;gap:16px}
.sticky-foot{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
@media (max-width:820px){.split{grid-template-columns:1fr}.split-l{position:static}}
.progress{height:8px;background:#E3E3E8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--mint2)}

/* ---- reporte ---- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border-radius:var(--r);padding:16px}.stat small{color:var(--ink2);display:block}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.about p{padding:12px 16px;margin:0}

/* ---- barra de pestañas flotante ---- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:99px;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);box-shadow:0 8px 30px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.05);z-index:10}
.tab{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink2)}
.tab.on{background:var(--mint);color:var(--ink)}
@media (max-width:520px){.tab span{display:none}}

/* ---- hojas (sheets) ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--bg);border-radius:20px;z-index:21;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s}
.sheet.wide{width:min(860px,96vw)}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.sheet-h>:last-child{justify-self:end}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.ask-msg{font-size:18px;margin:8px 0}
.msg-text{width:100%;border-radius:12px;border:1px solid var(--line);padding:12px;font-size:16px;background:#fff}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.share-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--red)}

/* ---- celular (iPhone, Galaxy): una columna, etiquetas debajo del nombre ---- */
@media (max-width:600px){
  html,body{font-size:16px}
  .page{padding:12px 14px 40px;gap:14px}
  .large{font-size:28px}
  .top{padding-left:14px;padding-right:14px}
  .top .pill:not(.test){display:none}
  .brand small{display:none}
  .card{padding:14px}
  .row-item{flex-wrap:wrap;padding:10px 12px;gap:10px}
  .row-item .chips{order:10;flex-basis:100%;justify-content:flex-start;padding-left:52px}
  .row-item .chips:empty{display:none}
  .row-item .time{width:62px;font-size:14px}
  .row-item .time + .avatar + .grow + .chips{padding-left:124px}
  .row-item .btn .lbl{display:none}
  .row-item .btn.small{padding:0 10px}
  .hero{flex-direction:column;align-items:flex-start;gap:12px}
  .hero .name{font-size:28px}
  .hero-actions{flex-direction:row;width:100%}.hero-actions .btn{flex:1}
  .ses-head{flex-direction:column;align-items:stretch}.ses-head .seg{align-self:flex-start}
  .ses-head h2{font-size:24px}
  .product .row{flex-wrap:wrap}
  .pay-total{flex-direction:column;align-items:flex-start}
  .kv{font-size:14px;gap:6px 10px}
  .field{padding:10px 12px}.field>span:first-child{max-width:50%;font-size:15px}
  .tiles{gap:10px}.tile{min-height:104px;padding:12px}
  .split{padding:12px}
  .sheet{width:100vw;max-height:92vh;top:auto;bottom:0;transform:translate(-50%,0);border-radius:20px 20px 0 0;animation:none}
  .sheet.wide{width:100vw}
  .keypad{grid-template-columns:repeat(3,70px);gap:14px}.key{width:70px;height:70px;font-size:28px}
  .auth h1{font-size:28px}
  .recovery-code{font-size:20px}
  .pad-wrap.small{width:180px}
  .initial-row{justify-content:space-between}
  .ph-h .btn{flex:1}
  .stats{grid-template-columns:1fr 1fr}.stat b{font-size:19px}
  .nav{padding-left:10px;padding-right:10px}.nav-title{max-width:46vw}
  .day-nav{gap:10px}
  .search input{font-size:16px}
  #toast{bottom:96px}
}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%;padding:0}
  .no-print,.tabbar,.nav,.top,.banner{display:none!important}
  .card{break-inside:avoid;border:1px solid #ddd}
}
